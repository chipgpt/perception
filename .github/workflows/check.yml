name: Validate trivia and game changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect published days and used facts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check-data.py --base "$BASE_SHA"
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: |
          python scripts/build-site.py
          for test in tests/verify-*.cjs; do node "$test"; done
